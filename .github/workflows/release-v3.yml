name: Build and publish OpenCart v3 release

on:
  push:
    branches: [v3]
    paths:
      - 'websky_lightning/**'
      - '.github/workflows/release-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: websky-lightning-v3-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read module version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' websky_lightning/install.xml | head -n1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build install package
        shell: bash
        run: |
          cd websky_lightning
          zip -qr "../websky_lightning_v3_v${{ steps.version.outputs.version }}.ocmod.zip" upload install.xml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          asset="websky_lightning_v3_v${VERSION}.ocmod.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
            gh release edit "$TAG" --title "Websky Lightning v${VERSION}" --target v3
          else
            gh release create "$TAG" "$asset" --target v3 --title "Websky Lightning v${VERSION}" --notes "Automated OpenCart 3 release for Websky Lightning v${VERSION}."
          fi

      - name: Check Version API token
        id: version_api_credentials
        env:
          VERSION_API_TOKEN: ${{ secrets.VERSION_API_TOKEN }}
        run: |
          if [[ -n "$VERSION_API_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::VERSION_API_TOKEN secret is not configured; version API notification was skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Version API
        if: steps.version_api_credentials.outputs.configured == 'true'
        env:
          VERSION_API_TOKEN: ${{ secrets.VERSION_API_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          curl --fail-with-body -G "https://opencart-ir.com/version/index.php" \
            --data-urlencode "route=tool/websky_version" \
            --data-urlencode "token=${VERSION_API_TOKEN}" \
            --data-urlencode "module=websky_lightning_v3" \
            --data-urlencode "version=${VERSION}" \
            --data-urlencode "released_at=$(git log -1 --format=%cI)" \
            --data-urlencode "description=$(git log -1 --format=%s)"
